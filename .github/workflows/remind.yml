# Напоминание от Макса в Telegram (работает, даже когда ПК и приложение выключены).
# Учебные данные не используются: текст, «фраза дня» и кнопка, открывающая Mini App. Что повторять, приложение покажет само.
# Секреты репозитория: TG_TOKEN (токен бота) и TG_CHAT (ваш chat id). Время — в cron, в UTC.
# Заодно настраивает профиль бота: кнопку меню «Макс» (открывает приложение) и описание.
name: remind
on:
  schedule:
    - cron: '23 15 * * *'   # ≈17:23 по Берлину летом (16:23 зимой); не ровный час — GitHub меньше задерживает запуск
  workflow_dispatch: {}      # кнопка «Run workflow» — проверить вручную
jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: send
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          APP_URL: https://german-learner-1135.web.app
          BOT_NAME: sambotDE_bot     # бот, в котором живёт Макс
        run: python3 .github/remind.py
